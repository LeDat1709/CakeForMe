<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thổi Nến Sinh Nhật</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="photo-frames">
        <div class="frame frame-1"><img src="freefire.jpg" alt="Photo 1"></div>
        <div class="frame frame-2"><img src="letandat.jpg" alt="Photo 2"></div>
        <div class="frame frame-3"><img src="letandat2.jpg" alt="Photo 3"></div>
        <div class="frame frame-4"><img src="letandat3.jpg" alt="Photo 4"></div>
    </div>

    <div class="container">
        <h1>Thổi vào micro để tắt nến! 🎂</h1>
        <div class="mic-status" id="status"></div>
        
        <div class="cake-container">
            <div class="plate"></div>
            
            <div class="tier tier-1">
                <div class="tier-body"></div>
                <div class="tier-top"></div>
            </div>

            <div class="tier tier-2">
                <div class="tier-body"></div>
                <div class="tier-top"></div>
            </div>

            <div class="tier tier-3">
                <div class="tier-body"></div>
                <div class="tier-top"></div>
            </div>

            <div class="tier tier-4">
                <div class="tier-body"></div>
                <div class="tier-top"></div>
            </div>

            <div class="tier tier-5">
                <div class="tier-body"></div>
                <div class="tier-top"></div>
            </div>

            <!-- Global candles container to overlay all tiers perfectly -->
            <div id="global-candles" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none;"></div>
        </div>
        
        <button id="start-btn">Bật Micro</button>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
